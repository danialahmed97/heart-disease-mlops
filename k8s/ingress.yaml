# Optional: requires an ingress controller (e.g. ingress-nginx) in the cluster.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: heart-disease-api
  namespace: heart-disease
spec:
  ingressClassName: nginx
  rules:
    - host: heart.localtest.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: heart-disease-api
                port:
                  name: http
